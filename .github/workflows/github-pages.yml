name: Deploy to GitHub Pages

on:
  push:
    branches: [ "master" ]
    paths:
      - 'content/**'
      - 'themes/**'
      - 'config.toml'
      - 'src/**'
      - 'package.json'
      - 'tsconfig.json'
      - '.github/workflows/github-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ZOLA_VERSION: "0.23.3"
    steps:
      - name: 'checkout'
        uses: actions/checkout@v7

      - name: 'setup node'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 'install dependencies'
        run: npm ci

      - name: 'compile typescript'
        run: npm run build:ts

      - name: 'install zola'
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: 'update build timestamp'
        run: |
          current_time=$(date -u +"%Y-%m-%d-%H-%M")
          sed -i "s/build_timestamp = .*/build_timestamp = \"$current_time\"/" config.toml

      - name: 'build site'
        run: zola build --base-url https://usips.org

      - name: 'check file sizes (14KB limit)'
        run: |
          echo "Checking HTML files against 14KB TCP initial congestion window..."
          echo "(Exempting /legal/ directory)"
          MAX_SIZE=14000
          WARNED=0

          # Check HTML files (excluding /legal/ directory)
          for file in $(find public -name "*.html" -type f | grep -v "public/legal/"); do
            size=$(stat -c%s "$file")
            if [ "$size" -gt "$MAX_SIZE" ]; then
              echo "::warning file=$file::File is ${size} bytes (exceeds ${MAX_SIZE} byte limit)"
              WARNED=1
            else
              echo "OK: $file is ${size} bytes"
            fi
          done

          # Report legal files (info only)
          for file in $(find public/legal -name "*.html" -type f 2>/dev/null); do
            size=$(stat -c%s "$file")
            echo "EXEMPT: $file is ${size} bytes (legal content)"
          done

          if [ "$WARNED" -eq 1 ]; then
            echo ""
            echo "::notice::Some HTML files exceed 14KB. See: https://endtimes.dev/why-your-website-should-be-under-14kb-in-size/"
          else
            echo ""
            echo "All checked HTML files are within the 14KB limit."
          fi

      - name: 'upload artifact'
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 'deploy'
        id: deployment
        uses: actions/deploy-pages@v5
