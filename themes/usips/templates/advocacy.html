{% extends "base.html" %}

{% block content %}
{% set filings = load_data(path="data/filings.toml") %}

<div class="page-header">
  <div class="container">
    <h1>{{ page.title }}</h1>
  </div>
</div>
<article class="page-content">
  <div class="content-wrapper">
    {{ page.content | safe }}

    <div class="docket-list">
      {% for entry in filings.filing %}
        {{<docket.entry filing={entry} />}}
      {% endfor %}
    </div>
  </div>
</article>
{% endblock content %}
