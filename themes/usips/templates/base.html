<!DOCTYPE html>
<html lang="{% if lang %}{{ lang }}{% else %}en{% endif %}">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ config.title }}{% endblock %}</title>
  <!-- Preload above-the-fold fonts so text renders in the right face on first paint -->
  <link rel="preload" href="{{ get_url(path='fonts/PublicSans-Regular.woff2') }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ get_url(path='fonts/PublicSans-SemiBold.woff2') }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ get_url(path='fonts/Merriweather-Bold.woff2') }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ get_url(path='fonts/Trust3A-XBold.woff2') }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ get_url(path='main.css') | safe }}?v={{ config.extra.build_timestamp }}">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">

  {% block extra_head %}{% endblock %}
</head>

<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  {% include "macros/header.html" %}

  <main id="main-content">
    {% block content %}{% endblock %}
  </main>

  {% include "macros/footer.html" %}

  <!-- HubSpot Forms API -->
  <script charset="utf-8" type="text/javascript" src="//js-na2.hsforms.net/forms/embed/v2.js"></script>
  <!-- Site JavaScript -->
  <script type="module" src="{{ get_url(path='js/main.js') }}?v={{ config.extra.build_timestamp }}"></script>

</body>

</html>
